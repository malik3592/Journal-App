name: journal
description: Offline trading journal for iOS and Android with Google Drive backup.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.1
  decimal: ^3.2.4
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  fl_chart: ^1.1.1
  image_picker: ^1.2.0
  google_sign_in: ^6.3.0
  googleapis: ^14.0.0
  http: ^1.4.0
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  share_plus: ^10.1.4
  file_selector: ^1.0.3
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
